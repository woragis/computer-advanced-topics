services:
  postgres:
    image: postgres:15
    container_name: fakeradar-postgres
    environment:
      POSTGRES_DB: fakeradar
      POSTGRES_USER: fakeradar_user
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakeradar_user -d fakeradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fakeradar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fakeradar
      RABBITMQ_DEFAULT_PASS: yourpassword
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  logging-worker:
    build:
      context: ./logging-worker
      dockerfile: Dockerfile
    container_name: fakeradar-logging-worker
    environment:
      RABBITMQ_URL: amqp://fakeradar:yourpassword@rabbitmq:5672
      LOG_QUEUE: fakeradar.logs
      LOG_DIR: /app/logs
    volumes:
      - logging_worker_logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: fakeradar-ai
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      FAKERADAR_ENV: development
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FACT_CHECK_API_KEY: ${FACT_CHECK_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      MAIN_SERVER_SECRET: ${MAIN_SERVER_SECRET:-dev-shared-secret-change-me}
      AI_MOCK_LLM: ${AI_MOCK_LLM:-true}
      RABBITMQ_URL: amqp://fakeradar:yourpassword@rabbitmq:5672
      LOG_QUEUE: fakeradar.logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/ai/health'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fakeradar-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://fakeradar_user:yourpassword@postgres:5432/fakeradar
      AI_SERVER_URL: http://ai:8000
      JWT_SECRET: dev_jwt_secret_must_be_at_least_16_chars
      JWT_EXPIRES_IN: "86400s"
      PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:3000
      RABBITMQ_URL: amqp://fakeradar:yourpassword@rabbitmq:5672
      LOG_QUEUE: fakeradar.logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8080/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: fakeradar-frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  logging_worker_logs:
